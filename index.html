<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d33">
<title>MedVia</title>
<style>
  :root{--brand:#2f7d33;--brand-d:#245f27;--brand-l:#e7f4de;--ink:#16321a;--muted:#5e7261;--line:#d7e3d1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#eef4ea;color:var(--ink);padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(22,50,26,.08);
    padding:32px 26px;max-width:380px;width:100%;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .logo svg{width:34px;height:34px;color:#fff}
  h1{font-size:24px;margin:0 0 4px}
  p{color:var(--muted);margin:0 0 24px;font-size:14px}
  a.btn{display:block;text-decoration:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-bottom:12px}
  a.med{background:var(--brand);color:#fff}
  a.adm{background:#fff;color:var(--brand-d);border:1.5px solid var(--brand)}
  .ver{margin-top:8px;font-size:11px;color:#9fb3a5}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v5M9.5 13.5h5"/></svg></div>
    <h1>MedVia</h1>
    <p>Lançamento de procedimentos</p>
    <a class="btn med" href="medico.html">Acesso do médico</a>
    <a class="btn adm" href="admin.html">Painel administrativo</a>
    <div class="ver">v2026.07.06 · medvia-1</div>
  </div>
</body>
</html>
